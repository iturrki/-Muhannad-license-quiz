name: Add category home

on:
  push:
    branches: [main]
    paths:
      - 'category-home-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build category landing page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          css='''
.category-grid{display:grid;grid-template-columns:1fr;gap:12px}
.category-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;transition:box-shadow .22s var(--ease),border-color .22s var(--ease),transform .22s var(--ease)}
.category-card:hover{border-color:#DDE1E5;transform:translateY(-2px);box-shadow:var(--shadow)}
.category-kicker{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:8px}
.category-card h2{font-size:22px;font-weight:700;line-height:1.45;letter-spacing:-.015em}
.category-card .desc{color:var(--muted);font-size:14px;line-height:1.7;margin-top:6px}
.category-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px;color:var(--muted);font-size:12.5px}
.category-meta span{padding:5px 10px;background:var(--soft);border-radius:var(--r-sm)}
.category-meta b{color:var(--ink);font-weight:600}
.category-head{padding:32px 0 22px}
'''
          if '.category-grid{' not in s:
              s=s.replace('.loading{', css+'\n.loading{', 1)

          old_html='''  <section id="home">
    <header class="hero">
      <p class="eyebrow">بنك أسئلة الرخصة المهنية</p>
      <h1>اختبارات الرخصة المهنية</h1>
      <p class="sub">تجميعات الأعوام السابقة، مرتّبة ومصحّحة. اختر تجميعة وتابع تقدّمك سؤالاً بسؤال.</p>
    </header>
    <section id="cards" class="index"><div class="loading">جاري تحميل الاختبارات…</div></section>
  </section>
  <section id="quiz" class="hidden">'''
          new_html='''  <section id="home">
    <header class="hero">
      <p class="eyebrow">بنك أسئلة الرخصة المهنية</p>
      <h1>اختبارات الرخصة المهنية</h1>
      <p class="sub">اختر نوع الاختبار أولاً، ثم انتقل إلى التجميعات والنماذج المتاحة.</p>
    </header>
    <section id="categories" class="category-grid"><div class="loading">جاري تحميل الأقسام…</div></section>
  </section>
  <section id="catalog" class="hidden">
    <header class="category-head">
      <button class="back" onclick="goLanding()">← الرئيسية</button>
      <h2 class="quiz-title" id="catalogTitle"></h2>
      <p class="quiz-stat" id="catalogStats"></p>
    </header>
    <section id="cards" class="index"></section>
  </section>
  <section id="quiz" class="hidden">'''
          if old_html not in s:
              raise SystemExit('home HTML block not found')
          s=s.replace(old_html,new_html,1)

          s=s.replace("let DATA={groups:[],total:0};let current=null;let submitted=false;","let DATA={groups:[],total:0};let current=null;let submitted=false;let currentCategory=null;",1)

          new_render=r'''function groupsForCategory(type){return type==='specialty'?DATA.groups.filter(g=>String(g.id).startsWith('specialty')):DATA.groups.filter(g=>!String(g.id).startsWith('specialty'))}
function categoryCard(type,title,desc,kicker){const gs=groupsForCategory(type),total=gs.reduce((n,g)=>n+(g.count||g.questions.length),0);return `<article class="category-card"><p class="category-kicker">${escapeHtml(kicker)}</p><h2>${escapeHtml(title)}</h2><p class="desc">${escapeHtml(desc)}</p><div class="category-meta"><span><b>${gs.length}</b> اختبارات</span><span><b>${total}</b> سؤالاً</span></div><button class="cta" onclick="openCategory('${type}')">عرض الاختبارات</button></article>`}
function renderLanding(){document.getElementById('quiz').classList.add('hidden');document.getElementById('catalog').classList.add('hidden');document.getElementById('home').classList.remove('hidden');const c=document.getElementById('categories');c.innerHTML=categoryCard('general','الاختبار التربوي العام','تجميعات التربوي العام، واللغوي والكمي، مرتبة حسب النماذج المتاحة.','التربوي')+categoryCard('specialty','اختبار التخصص – كيمياء','نماذج تخصص الكيمياء مقسمة إلى اختبارات قصيرة لتسهيل الحل والمتابعة.','التخصص')}
function renderCategory(type){const gs=groupsForCategory(type),cards=document.getElementById('cards');cards.innerHTML='';for(const g of gs)cards.insertAdjacentHTML('beforeend',examCard(g));document.getElementById('catalogTitle').textContent=type==='specialty'?'اختبار التخصص – كيمياء':'الاختبار التربوي العام';document.getElementById('catalogStats').textContent=`${gs.length} اختبارات • ${gs.reduce((n,g)=>n+(g.count||g.questions.length),0)} سؤالاً`}
function openCategory(type){currentCategory=type;document.getElementById('home').classList.add('hidden');document.getElementById('quiz').classList.add('hidden');document.getElementById('catalog').classList.remove('hidden');renderCategory(type);window.scrollTo({top:0,behavior:'smooth'})}
function goLanding(){currentCategory=null;renderLanding();window.scrollTo({top:0,behavior:'smooth'})}'''
          s,n=re.subn(r'function renderHome\(\)\{.*?\}\nfunction restartQuiz',new_render+'\nfunction restartQuiz',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('renderHome patch failed')

          new_go=r'''function goHome(){current=null;submitted=false;document.getElementById('quiz').classList.add('hidden');if(currentCategory){document.getElementById('home').classList.add('hidden');document.getElementById('catalog').classList.remove('hidden');renderCategory(currentCategory)}else{renderLanding()}window.scrollTo({top:0,behavior:'smooth'})}'''
          s,n=re.subn(r'function goHome\(\)\{.*?\}\nasync function decodeBase',new_go+'\nasync function decodeBase',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('goHome patch failed')

          s=s.replace('DATA.total=DATA.groups.reduce((s,g)=>s+(g.count||g.questions.length),0);renderHome()','DATA.total=DATA.groups.reduce((s,g)=>s+(g.count||g.questions.length),0);renderLanding()',1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add separate general and chemistry category pages"
          git push
