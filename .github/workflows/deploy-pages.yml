name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const vm = require('vm');

          // Decode only the original general-question bundle during build.
          const context = { window: {} };
          vm.createContext(context);
          for (let i = 1; i <= 5; i++) {
            vm.runInContext(fs.readFileSync(`data/c${i}.js`, 'utf8'), context, {filename:`data/c${i}.js`});
          }

          const b64 = context.window.QZ_B64 || '';
          if (!b64) throw new Error('Quiz data is empty');
          const gz = Buffer.from(b64, 'base64');
          let data;
          try {
            data = zlib.gunzipSync(gz).toString('utf8');
          } catch (err) {
            console.warn('gzip checksum failed; retrying raw DEFLATE payload');
            if (gz.length < 18 || gz[0] !== 0x1f || gz[1] !== 0x8b) throw err;
            const flg = gz[3];
            let p = 10;
            if (flg & 4) { const xlen = gz[p] | (gz[p+1] << 8); p += 2 + xlen; }
            if (flg & 8) { while (p < gz.length && gz[p++] !== 0); }
            if (flg & 16) { while (p < gz.length && gz[p++] !== 0); }
            if (flg & 2) p += 2;
            data = zlib.inflateRawSync(gz.subarray(p, gz.length - 8)).toString('utf8');
          }

          const parsed = JSON.parse(data);
          if (!Array.isArray(parsed.groups)) throw new Error('Quiz JSON structure invalid');

          // Keep the cleaned 1444 section.
          const clean1444 = JSON.parse(fs.readFileSync('data/clean-1444.json', 'utf8'));
          const cleanGroup = {
            id:'edu1444',
            title:'التربوي العام 1444هـ',
            subtitle:'تجميعات التربوي العام',
            count:clean1444.count,
            questions:clean1444.questions.map(q=>({
              n:q.id,
              text:q.question,
              options:Object.entries(q.options).map(([key,text])=>({key,text})),
              answer:q.answer
            }))
          };
          const gi = parsed.groups.findIndex(g=>g.id==='edu1444');
          if (gi >= 0) parsed.groups[gi] = cleanGroup;
          parsed.total = parsed.groups.reduce((sum,g)=>sum+(g.count || g.questions?.length || 0),0);

          function makePage(pageData, autoOpen1444=false) {
            let out = fs.readFileSync('index.html','utf8');

            // General data is embedded below, so these old compressed data files are not needed by the browser.
            out = out.replace(/<script src="https:\/\/cdn\.jsdelivr\.net[^>]*><\/script>\s*/g,'');
            out = out.replace(/<script src="data\/c\d+\.js"><\/script>\s*/g,'');
            out = out.replace(/let DATA=\{groups:\[\],total:0\};/, `const DATA=${JSON.stringify(pageData)};`);

            const startup = `
(function(){
  const compact=(window.SPEC_COMPACT||[]).map(g=>({
    ...g,
    questions:g.questions.map((r,i)=>({
      n:i+1,
      text:String(r[0]||'').replace(/\\s*\\|\\s*/g,'\\n'),
      options:LETTERS.map(k=>({key:k,text:'اختيار '+k})),
      answer:r[1], source:r[2], source_q:r[3], compact:true
    }))
  }));
  const specialty=[...(window.SPEC_GROUPS||[]),...compact];
  const seen=new Set(DATA.groups.map(g=>g.id));
  for(const g of specialty){ if(!seen.has(g.id)){ DATA.groups.push(g); seen.add(g.id); } }
  DATA.total=DATA.groups.reduce((s,g)=>s+(g.count||g.questions.length),0);
  renderHome();
  ${autoOpen1444 ? "openQuiz('edu1444');" : ''}
})();`;

            out = out.replace(/async function boot\(\)\{[\s\S]*?\}boot\(\);/, startup);
            return out;
          }

          fs.rmSync('_site',{recursive:true,force:true});
          fs.mkdirSync('_site/data',{recursive:true});
          fs.writeFileSync('_site/index.html',makePage(parsed),'utf8');
          fs.writeFileSync('_site/preview-1444.html',makePage({groups:[cleanGroup],total:cleanGroup.count},true),'utf8');

          // Specialty question files are loaded normally in the browser.
          for (const name of fs.readdirSync('data')) {
            if (name.startsWith('specialty') && name.endsWith('.js')) {
              fs.copyFileSync(`data/${name}`, `_site/data/${name}`);
            }
          }
          fs.writeFileSync('_site/.nojekyll','');
          console.log(`Built general site with ${parsed.total} base questions; specialty files copied for browser loading.`);
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
