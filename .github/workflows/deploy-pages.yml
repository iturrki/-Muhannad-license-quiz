name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build self-contained site
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const vm = require('vm');

          const context = { window: {} };
          vm.createContext(context);
          for (let i = 1; i <= 5; i++) {
            const code = fs.readFileSync(`data/c${i}.js`, 'utf8');
            vm.runInContext(code, context, { filename: `data/c${i}.js` });
          }

          const b64 = context.window.QZ_B64 || '';
          if (!b64) throw new Error('Quiz data is empty');
          const gz = Buffer.from(b64, 'base64');

          let data;
          try {
            data = zlib.gunzipSync(gz).toString('utf8');
          } catch (err) {
            console.warn('gzip wrapper checksum failed; retrying raw DEFLATE payload');
            if (gz.length < 18 || gz[0] !== 0x1f || gz[1] !== 0x8b) throw err;
            const flg = gz[3];
            let p = 10;
            if (flg & 4) { const xlen = gz[p] | (gz[p+1] << 8); p += 2 + xlen; }
            if (flg & 8) { while (p < gz.length && gz[p++] !== 0); }
            if (flg & 16) { while (p < gz.length && gz[p++] !== 0); }
            if (flg & 2) p += 2;
            data = zlib.inflateRawSync(gz.subarray(p, gz.length - 8)).toString('utf8');
          }

          const parsed = JSON.parse(data);
          if (!parsed.groups || !parsed.total) throw new Error('Quiz JSON structure invalid');

          let html = fs.readFileSync('index.html', 'utf8');
          html = html.replace(/<script src="https:\/\/cdn\.jsdelivr\.net[^>]*><\/script>\s*/g, '');
          html = html.replace(/<script src="data\/c\d+\.js"><\/script>\s*/g, '');
          html = html.replace(/let DATA=\{groups:\[\],total:0\};/, `const DATA=${data};`);
          html = html.replace(/async function boot\(\)\{[\s\S]*?\n\}\nboot\(\);/, 'renderHome();');
          html = html.replace('      <p>حل الأسئلة نصيًا، واحصل على النتيجة بعد إنهاء الاختبار.</p>\n', '');
          html = html.replace('      <span class="pill" id="totalPill"></span>\n', '');
          html = html.replace("  document.getElementById('totalPill').textContent=DATA.total+' سؤال';\n", '');

          fs.mkdirSync('_site', { recursive: true });
          fs.writeFileSync('_site/index.html', html, 'utf8');
          console.log('Built quiz with', parsed.total, 'questions');
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
