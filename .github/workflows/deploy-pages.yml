name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build self-contained site
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const vm = require('vm');

          const context = { window: {} };
          vm.createContext(context);
          for (let i = 1; i <= 5; i++) {
            const code = fs.readFileSync(`data/c${i}.js`, 'utf8');
            vm.runInContext(code, context, { filename: `data/c${i}.js` });
          }

          const b64 = context.window.QZ_B64 || '';
          if (!b64) throw new Error('Quiz data is empty');
          const gz = Buffer.from(b64, 'base64');

          let data;
          try {
            data = zlib.gunzipSync(gz).toString('utf8');
          } catch (err) {
            console.warn('gzip wrapper checksum failed; retrying raw DEFLATE payload');
            if (gz.length < 18 || gz[0] !== 0x1f || gz[1] !== 0x8b) throw err;
            const flg = gz[3];
            let p = 10;
            if (flg & 4) { const xlen = gz[p] | (gz[p+1] << 8); p += 2 + xlen; }
            if (flg & 8) { while (p < gz.length && gz[p++] !== 0); }
            if (flg & 16) { while (p < gz.length && gz[p++] !== 0); }
            if (flg & 2) p += 2;
            data = zlib.inflateRawSync(gz.subarray(p, gz.length - 8)).toString('utf8');
          }

          const parsed = JSON.parse(data);
          if (!parsed.groups || !parsed.total) throw new Error('Quiz JSON structure invalid');

          const clean1444 = JSON.parse(fs.readFileSync('data/clean-1444.json', 'utf8'));
          const cleanGroup = {
            id: 'edu1444',
            title: 'التربوي العام 1444هـ',
            subtitle: 'تجميعات التربوي العام',
            count: clean1444.count,
            questions: clean1444.questions.map(q => ({
              n: q.id,
              text: q.question,
              options: Object.entries(q.options).map(([key, text]) => ({ key, text })),
              answer: q.answer
            }))
          };

          const groupIndex = parsed.groups.findIndex(g => g.id === 'edu1444');
          if (groupIndex === -1) throw new Error('1444 quiz group not found');
          parsed.groups[groupIndex] = cleanGroup;
          parsed.total = parsed.groups.reduce((sum, g) => sum + g.count, 0);
          data = JSON.stringify(parsed);

          function makePage(pageData, autoOpen1444 = false) {
            let out = fs.readFileSync('index.html', 'utf8');
            out = out.replace(/<script src="https:\/\/cdn\.jsdelivr\.net[^>]*><\/script>\s*/g, '');
            out = out.replace(/<script src="data\/c\d+\.js"><\/script>\s*/g, '');
            out = out.replace(/let DATA=\{groups:\[\],total:0\};/, `const DATA=${JSON.stringify(pageData)};`);
            out = out.replace(/async function boot\(\)\{[\s\S]*?\n\}\nboot\(\);/, autoOpen1444 ? "renderHome();openQuiz('edu1444');" : 'renderHome();');
            out = out.replace('      <p>حل الأسئلة نصيًا، واحصل على النتيجة بعد إنهاء الاختبار.</p>\n', '');
            out = out.replace('      <span class="pill" id="totalPill"></span>\n', '');
            out = out.replace("  document.getElementById('totalPill').textContent=DATA.total+' سؤال';\n", '');
            out = out.replace('    <p class="note">الأسئلة ومفاتيح الإجابة مستخرجة من ملف التجميعات المرفق. قد تظهر بعض الكلمات كما وردت في استخراج النص من ملف PDF.</p>\n', '');
            return out;
          }

          fs.mkdirSync('_site', { recursive: true });
          fs.writeFileSync('_site/index.html', makePage(parsed), 'utf8');
          fs.writeFileSync('_site/preview-1444.html', makePage({ groups: [cleanGroup], total: cleanGroup.count }, true), 'utf8');
          console.log('Built main site and direct 1444 preview with', clean1444.count, 'cleaned questions');
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
