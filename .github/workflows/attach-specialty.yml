name: Attach specialty quizzes

on:
  push:
    branches: [main]
    paths:
      - 'deploy-trigger-specialty.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch quiz page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          scripts='''<script src="data/specialty1.js"></script>
          <script src="data/specialty2.js"></script>
          <script src="data/specialty3.js"></script>
          <script src="data/specialty4a.js"></script>
          <script src="data/specialty4b.js"></script>
          <script src="data/specialty4c.js"></script>
          <script src="data/specialty5.js"></script>
          <script src="data/specialty6.js"></script>
          <script src="data/specialty7.js"></script>
          <script src="data/specialty8.js"></script>
          <script src="data/specialty9.js"></script>
          <script src="data/specialty10.js"></script>
          <script src="data/specialty11.js"></script>
          <script src="data/specialty12.js"></script>
          <script src="data/specialty13.js"></script>
          <script src="data/specialty14.js"></script>'''
          anchor='<script src="data/c5.js"></script>'
          if 'data/specialty1.js' not in s:
              s=s.replace(anchor,anchor+'\n'+scripts)
          if 'white-space:pre-line' not in s:
              s=s.replace('.qtext{font-size:17px;font-weight:750;line-height:1.85;flex:1}', '.qtext{font-size:17px;font-weight:750;line-height:1.85;flex:1;white-space:pre-line}')
          if '.qimg{' not in s:
              s=s.replace('.opts{display:grid;gap:8px}', '.qimg{display:block;width:100%;height:auto;border-radius:12px;margin:8px 0 12px;border:1px solid #e5e7eb}\n.opts{display:grid;gap:8px}')
          old='''c.innerHTML=`<div class="qhead"><div class="qtext">${escapeHtml(q.text)}</div><div class="qnum">${q.n}</div></div>
      <div class="opts">'''
          new='''c.innerHTML=`<div class="qhead"><div class="qtext">${escapeHtml(q.text)}</div><div class="qnum">${q.n}</div></div>
      ${q.image?`<img class="qimg" src="${q.image}" alt="السؤال ${q.n}">`:''}
      <div class="opts">'''
          if old in s:
              s=s.replace(old,new)
          needle='''    DATA=JSON.parse(text);
    renderHome();'''
          repl='''    DATA=JSON.parse(text);
    const compact=(window.SPEC_COMPACT||[]).map(g=>({...g,questions:g.questions.map((r,i)=>({n:i+1,text:String(r[0]||'').replace(/\\s*\\|\\s*/g,'\\n'),options:LETTERS.map(k=>({key:k,text:''})),answer:r[1],source:r[2],source_q:r[3]}))}));
    DATA.groups.push(...(window.SPEC_GROUPS||[]),...compact);
    DATA.total=DATA.groups.reduce((sum,g)=>sum+(g.count||g.questions.length),0);
    renderHome();'''
          if 'window.SPEC_COMPACT' not in s:
              s=s.replace(needle,repl)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Integrate specialty chemistry quizzes"
          git push
