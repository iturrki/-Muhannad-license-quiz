<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FCFCFD">
<title>اختبارات الرخصة المهنية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#FCFCFD;--surface:#FFFFFF;--soft:#F3F6F5;--line:#EBEDF0;
  --ink:#0E1116;--muted:#6E7681;--accent:#1F6F5C;--even:#DE8A34;--bad:#C63D2F;
  --r-sm:6px;--r-md:10px;--r-lg:14px;
  --shadow:0 4px 6px -2px rgba(14,17,22,.04),0 14px 26px -10px rgba(14,17,22,.10);
  --ease:cubic-bezier(.2,.8,.2,1)
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{min-height:100vh;background:var(--canvas);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-feature-settings:"tnum" 1,"lnum" 1;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:var(--r-sm)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;scroll-behavior:auto!important}}
.hidden{display:none!important}
.wrap{max-width:660px;margin-inline:auto;padding:0 20px 100px}
.hero{padding:44px 0 26px}
.eyebrow{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);background:var(--soft);padding:5px 12px;border-radius:var(--r-sm);margin-bottom:16px}
h1{font-weight:700;font-size:clamp(30px,7.8vw,40px);line-height:1.32;letter-spacing:-.025em}
.sub{color:var(--muted);font-size:15px;line-height:1.75;margin-top:10px;max-width:42ch}
.index{display:flex;flex-direction:column;gap:10px}
.exam{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;transition:box-shadow .22s var(--ease),border-color .22s var(--ease),transform .22s var(--ease)}
.exam:hover{border-color:#DDE1E5;transform:translateY(-2px);box-shadow:var(--shadow)}
.exam-top{display:flex;align-items:center;gap:16px}
.exam-text{flex:1;min-width:0}
.exam h2{font-weight:600;font-size:17.5px;letter-spacing:-.015em}
.exam .desc{color:var(--muted);font-size:13px;margin-top:3px}
.score{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px}
.dial{position:relative;width:54px;height:54px;display:grid;place-items:center;--ring:var(--accent)}
.dial .arc{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--ring) calc(var(--p)*3.6deg),var(--line) 0);-webkit-mask:radial-gradient(farthest-side,transparent 70%,#000 71%);mask:radial-gradient(farthest-side,transparent 70%,#000 71%);transition:background .6s var(--ease)}
.dial .pct{position:relative;z-index:1;font-size:14px;font-weight:700;color:var(--ink);line-height:1;display:flex;align-items:baseline;gap:1px}
.dial .pct i{font-style:normal;font-size:9px;font-weight:500;color:var(--muted)}
.score-label{font-size:10.5px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.dial.even{--ring:var(--even)}.dial.low{--ring:var(--bad)}.dial.empty{--ring:var(--line)}.dial.empty .pct{color:var(--muted);font-weight:500}
.track{height:6px;margin-top:16px;border-radius:99px;overflow:hidden;background:var(--line)}
.bar{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s var(--ease)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:14px;font-size:12.5px;color:var(--muted)}
.meta span{padding:4px 10px;background:var(--soft);border-radius:var(--r-sm)}
.meta b{color:var(--ink);font-weight:600}
.cta{display:block;width:100%;margin-top:16px;padding:13px;border-radius:var(--r-md);background:var(--accent);color:#fff;font-weight:600;font-size:14.5px;box-shadow:0 1px 2px rgba(14,17,22,.1);transition:filter .2s var(--ease),transform .12s var(--ease)}
.cta:hover{filter:brightness(1.08)}.cta:active{transform:scale(.99)}
.cta.ghost{background:transparent;color:var(--accent);border:1px solid var(--line);box-shadow:none}
.cta.ghost:hover{border-color:var(--accent);background:var(--soft);filter:none}
.cta.danger{background:transparent;color:var(--bad);border:1px solid var(--line);box-shadow:none}
.rubric{display:flex;align-items:center;gap:14px;margin:50px 0 14px;font-size:12px;font-weight:600;color:var(--muted)}
.rubric::after{content:"";flex:1;height:1px;background:var(--line)}
.loading{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;color:var(--muted);font-size:14px}
.quiz-head{padding:28px 0 18px}
.back{display:inline-flex;align-items:center;gap:7px;color:var(--accent);font-size:13px;font-weight:600;margin-bottom:14px}
.quiz-title{font-size:24px;font-weight:700;line-height:1.4}
.quiz-stat{font-size:13px;color:var(--muted);margin-top:5px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px}
.qnum{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);background:var(--soft);padding:4px 10px;border-radius:var(--r-sm);margin-bottom:16px}
.qtext{font-size:18px;line-height:1.8;font-weight:600;letter-spacing:-.01em;white-space:pre-line}
.qimg{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:var(--r-md);margin-top:18px}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:22px}
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:right;padding:14px 15px;border:1px solid var(--line);border-radius:var(--r-md);font-size:15px;transition:all .18s var(--ease)}
.choice:hover{border-color:var(--accent);background:var(--soft)}
.tag{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--soft);font-size:12px;font-weight:600;color:var(--muted);transition:all .18s var(--ease)}
.choice:hover .tag{background:var(--accent);color:#fff}
.choice.selected{border-color:var(--accent);background:rgba(31,111,92,.05)}
.choice.selected .tag{background:var(--accent);color:#fff}
.choice.correct{border-color:var(--accent);background:rgba(31,111,92,.06)}
.choice.correct .tag{background:var(--accent);color:#fff}
.choice.wrong{border-color:var(--bad);background:rgba(198,61,47,.05)}
.choice.wrong .tag{background:var(--bad);color:#fff}
.choice:disabled{cursor:default}
.choice:disabled:hover{border-color:var(--line);background:transparent}
.choice.correct:disabled:hover{border-color:var(--accent);background:rgba(31,111,92,.06)}
.choice.wrong:disabled:hover{border-color:var(--bad);background:rgba(198,61,47,.05)}
.qnav{display:flex;gap:10px;margin-top:22px}
.qnav .cta{margin-top:0}
.qnav .cta:disabled{opacity:.4;cursor:not-allowed;filter:none}
.finish{margin-top:10px}
.result{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;margin-bottom:14px;box-shadow:var(--shadow)}
.result-kicker{font-size:12px;font-weight:600;color:var(--muted)}
.result-score{font-size:42px;font-weight:700;line-height:1.15;margin-top:4px;color:var(--accent)}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.result-box{background:var(--soft);border-radius:var(--r-md);padding:12px;text-align:center;font-size:12px;color:var(--muted)}
.result-box b{display:block;color:var(--ink);font-size:20px;margin-bottom:1px}
.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.result-actions .cta{margin-top:0}
@media(max-width:520px){.wrap{padding-inline:16px}.exam{padding:18px}.qcard{padding:20px}.result-grid{grid-template-columns:repeat(3,1fr)}.result-actions{grid-template-columns:1fr}.qtext{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
  <section id="home">
    <header class="hero">
      <p class="eyebrow">بنك أسئلة الرخصة المهنية</p>
      <h1>اختبارات الرخصة المهنية</h1>
      <p class="sub">تجميعات الأعوام السابقة، مرتّبة ومصحّحة. اختر تجميعة وتابع تقدّمك سؤالاً بسؤال.</p>
    </header>
    <section id="cards" class="index">
      <div class="loading">جاري تحميل الاختبارات…</div>
    </section>
  </section>

  <section id="quiz" class="hidden">
    <header class="quiz-head">
      <button class="back" onclick="goHome()">← العودة إلى الاختبارات</button>
      <h2 class="quiz-title" id="quizTitle"></h2>
      <p class="quiz-stat" id="quizStats"></p>
    </header>

    <section id="result" class="result hidden"></section>

    <section class="qcard">
      <p class="qnum" id="qnum"></p>
      <p class="qtext" id="qtext"></p>
      <div id="qimage"></div>
      <div class="choices" id="choices"></div>

      <div class="qnav">
        <button id="prevBtn" class="cta ghost" onclick="move(-1)">السابق</button>
        <button id="nextBtn" class="cta" onclick="move(1)">التالي</button>
      </div>
      <button id="finishBtn" class="cta ghost finish" onclick="submitQuiz()">إنهاء وتصحيح الاختبار</button>
    </section>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script src="data/c1.js"></script>
<script src="data/c2.js"></script>
<script src="data/c3.js"></script>
<script src="data/c4.js"></script>
<script src="data/c5.js"></script>
<script src="data/specialty-clean.js"></script>
<script>
let DATA={groups:[],total:0};
let current=null;
let currentIndex=0;
let submitted=false;

const answersKey=id=>'muhannad_quiz_'+id;
const doneKey=id=>'muhannad_quiz_done_'+id;

function load(id){
  try{return JSON.parse(localStorage.getItem(answersKey(id))||'{}')}
  catch(e){return {}}
}
function save(id,a){localStorage.setItem(answersKey(id),JSON.stringify(a))}
function isDone(id){return localStorage.getItem(doneKey(id))==='1'}
function setDone(id,v){v?localStorage.setItem(doneKey(id),'1'):localStorage.removeItem(doneKey(id))}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function statsFor(g){
  const a=load(g.id);
  let answered=0,correct=0;
  for(const q of g.questions){
    if(a[q.n]){
      answered++;
      if(a[q.n]===q.answer)correct++;
    }
  }
  const wrong=answered-correct;
  const pct=answered?Math.round(correct/answered*100):0;
  return {answered,correct,wrong,pct,done:isDone(g.id)};
}

function firstUnanswered(g){
  const a=load(g.id);
  const i=g.questions.findIndex(q=>!a[q.n]);
  return i<0?0:i;
}

function examCard(g){
  const s=statsFor(g);
  const progress=g.count?Math.round((s.answered/g.count)*100):0;
  const showScore=s.done&&s.answered>0;
  const dialClass=!showScore?'empty':(s.pct===50?'even':(s.pct<50?'low':''));
  const pctHtml=showScore?`${s.pct}<i>٪</i>`:'—';
  const meta=s.answered
    ?`<span>أجبت <b>${s.answered}</b></span>${showScore?`<span>صحيح <b>${s.correct}</b></span>`:''}`
    :'<span>لم تبدأ بعد</span>';
  let label='بدء الاختبار',ghost='';
  if(s.done){label='مراجعة الإجابات';ghost=' ghost'}
  else if(s.answered){label=`متابعة من السؤال ${firstUnanswered(g)+1}`}
  return `<article class="exam">
    <div class="exam-top">
      <div class="exam-text">
        <h2>${escapeHtml(g.title)}</h2>
        <p class="desc">${escapeHtml(g.subtitle||'')}</p>
      </div>
      <div class="score">
        <div class="dial ${dialClass}" style="--p:${showScore?s.pct:0}"><span class="arc"></span><span class="pct">${pctHtml}</span></div>
        <span class="score-label">صح</span>
      </div>
    </div>
    <div class="track" role="progressbar" aria-valuenow="${progress}" aria-valuemin="0" aria-valuemax="100">
      <span class="bar" style="width:${progress}%"></span>
    </div>
    <div class="meta"><span><b>${g.count}</b> سؤالاً</span>${meta}</div>
    <button class="cta${ghost}" onclick="openQuiz('${g.id}')">${label}</button>
  </article>`;
}

function renderHome(){
  const c=document.getElementById('cards');
  const general=DATA.groups.filter(g=>!String(g.id).startsWith('specialty'));
  const spec=DATA.groups.filter(g=>String(g.id).startsWith('specialty'));
  let out=general.map(examCard).join('');
  if(spec.length){
    out+=`<p class="rubric">اختبارات التخصص — كيمياء</p>`;
    out+=spec.map(examCard).join('');
  }
  c.innerHTML=out||'<div class="loading">لا توجد اختبارات متاحة حالياً.</div>';
}

function openQuiz(id){
  current=DATA.groups.find(g=>g.id===id);
  if(!current)return;
  submitted=isDone(id);
  currentIndex=submitted?0:firstUnanswered(current);
  document.getElementById('home').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  document.getElementById('quizTitle').textContent=current.title;
  renderQuestion();
  renderResult();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderQuestion(){
  if(!current)return;
  const q=current.questions[currentIndex];
  const a=load(current.id);
  const chosen=a[q.n];

  document.getElementById('qnum').textContent=`السؤال ${currentIndex+1} من ${current.count}`;
  document.getElementById('qtext').textContent=q.text||'';
  document.getElementById('quizStats').textContent=`أجبت عن ${Object.keys(a).filter(k=>a[k]).length} من ${current.count}`;

  const imageWrap=document.getElementById('qimage');
  imageWrap.innerHTML=q.image?`<img class="qimg" src="${q.image}" alt="السؤال ${q.n}">`:'';

  const choices=document.getElementById('choices');
  choices.innerHTML=q.options.map(o=>{
    let cls='choice';
    if(submitted){
      if(o.key===q.answer)cls+=' correct';
      else if(o.key===chosen)cls+=' wrong';
    }else if(o.key===chosen){
      cls+=' selected';
    }
    return `<button class="${cls}" ${submitted?'disabled':''} onclick="choose('${o.key}')">
      <span class="tag">${escapeHtml(o.key)}</span>
      <span>${escapeHtml(o.text||('اختيار '+o.key))}</span>
    </button>`;
  }).join('');

  document.getElementById('prevBtn').disabled=currentIndex===0;
  const next=document.getElementById('nextBtn');
  if(currentIndex===current.questions.length-1){
    next.textContent=submitted?'العودة إلى النتيجة':'إنهاء وتصحيح';
  }else{
    next.textContent='التالي';
  }
  document.getElementById('finishBtn').classList.toggle('hidden',submitted);
}

function choose(k){
  if(submitted||!current)return;
  const q=current.questions[currentIndex];
  const a=load(current.id);
  a[q.n]=k;
  save(current.id,a);
  renderQuestion();
}

function move(step){
  if(!current)return;
  if(step>0&&currentIndex===current.questions.length-1){
    if(submitted){
      document.getElementById('result').scrollIntoView({behavior:'smooth',block:'start'});
    }else{
      submitQuiz();
    }
    return;
  }
  currentIndex=Math.max(0,Math.min(current.questions.length-1,currentIndex+step));
  renderQuestion();
  document.querySelector('.quiz-head').scrollIntoView({behavior:'smooth',block:'start'});
}

function submitQuiz(){
  if(!current)return;
  submitted=true;
  setDone(current.id,true);
  renderQuestion();
  renderResult();
  document.getElementById('result').scrollIntoView({behavior:'smooth',block:'start'});
}

function renderResult(){
  const r=document.getElementById('result');
  if(!current||!submitted){r.classList.add('hidden');r.innerHTML='';return}
  const s=statsFor(current);
  const blank=current.count-s.answered;
  const pct=current.count?Math.round(s.correct/current.count*100):0;
  r.classList.remove('hidden');
  r.innerHTML=`<p class="result-kicker">النتيجة</p>
    <div class="result-score">${pct}٪</div>
    <div class="result-grid">
      <div class="result-box"><b>${s.correct}</b>صحيح</div>
      <div class="result-box"><b>${s.wrong}</b>خطأ</div>
      <div class="result-box"><b>${blank}</b>بدون إجابة</div>
    </div>
    <div class="result-actions">
      <button class="cta ghost" onclick="goHome()">العودة للاختبارات</button>
      <button class="cta danger" onclick="resetQuiz()">إعادة الاختبار</button>
    </div>`;
}

function resetQuiz(){
  if(!current)return;
  if(!confirm('هل تريد مسح جميع إجابات هذا الاختبار والبدء من جديد؟'))return;
  localStorage.removeItem(answersKey(current.id));
  setDone(current.id,false);
  submitted=false;
  currentIndex=0;
  renderQuestion();
  renderResult();
  window.scrollTo({top:0,behavior:'smooth'});
}

function goHome(){
  current=null;
  submitted=false;
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('home').classList.remove('hidden');
  renderHome();
  window.scrollTo({top:0,behavior:'smooth'});
}

async function decodeBase(){
  const bin=atob(window.QZ_B64||'');
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  try{
    if(typeof DecompressionStream==='undefined')throw new Error('no native gzip');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(stream).text();
  }catch(e){
    if(!window.pako)throw e;
    return new TextDecoder('utf-8').decode(window.pako.ungzip(bytes));
  }
}

async function boot(){
  try{
    DATA=JSON.parse(await decodeBase());

    try{
      const r=await fetch('data/clean-1444.json',{cache:'no-store'});
      if(r.ok){
        const j=await r.json();
        const clean={
          id:'edu1444',
          title:'التربوي العام 1444هـ',
          subtitle:'تجميعات التربوي العام',
          count:j.count,
          questions:j.questions.map(q=>({
            n:q.id,
            text:q.question,
            options:Object.entries(q.options).map(([key,text])=>({key,text})),
            answer:q.answer
          }))
        };
        const i=DATA.groups.findIndex(g=>g.id==='edu1444');
        if(i>=0)DATA.groups[i]=clean;
      }
    }catch(e){}

    const seen=new Set(DATA.groups.map(g=>g.id));
    for(const g of(window.SPEC_GROUPS||[])){
      if(!seen.has(g.id)){
        DATA.groups.push(g);
        seen.add(g.id);
      }
    }

    DATA.total=DATA.groups.reduce((s,g)=>s+(g.count||g.questions.length),0);
    renderHome();
  }catch(e){
    console.error(e);
    document.getElementById('cards').innerHTML='<div class="loading"><b>تعذر تحميل الأسئلة.</b><br>حدّث الصفحة مرة أخرى.</div>';
  }
}
boot();
</script>
</body>
</html>
